[project]
name = "legacy-mission-control-tools"
version = "0.1.0"
description = "Maintenance tools for the Legacy Mission Control prompt library"
requires-python = ">=3.9"

[dependency-groups]
dev = ["ruff==0.15.21"]

[tool.ruff]
target-version = "py39"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
